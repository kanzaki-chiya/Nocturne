<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      (() => {
        if (window.parent === window) return;
        let loaded = false;
        function onMessage(event) {
          if (loaded || event.source !== window.parent) return;
          const data = event.data;
          if (!data || typeof data !== "object" || data.type !== "nocturne:mcp-app:load") return;
          if (typeof data.html !== "string") return;
          loaded = true;
          window.removeEventListener("message", onMessage);
          document.open();
          document.write(data.html);
          document.close();
        }
        window.addEventListener("message", onMessage);
        const notifyReady = () => {
          if (!loaded) {
            window.parent.postMessage({ type: "nocturne:mcp-app:ready" }, "*");
          }
        };
        notifyReady();
        window.addEventListener("load", notifyReady, { once: true });
      })();
    </script>
  </body>
</html>

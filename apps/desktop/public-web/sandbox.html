<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style id="__nct_theme__"></style>
    <style id="__nct_base__">
      :where(:root) {
        box-sizing: border-box;
        height: auto;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: var(--nct-fs, 14px);
        line-height: 1.5;
      }
      :where(:root:not([data-nct-fullscreen="true"])) {
        overflow-y: hidden;
      }
      :where(*, *::before, *::after) {
        box-sizing: border-box;
      }
      :where(body) {
        margin: 0;
        padding: 20px;
        height: auto;
        display: flow-root;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      @media (max-width: 560px) {
        :where(body) {
          padding: 14px;
        }
      }
      :where(code, pre, kbd, samp) {
        font-family: var(--mono);
      }
      :root[data-nct-fullscreen="true"] :where(body) {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script id="__nct_bridge__">
      (() => {
        if (window.parent === window) return;
        const themeEl = document.getElementById("__nct_theme__");
        const baseEl = document.getElementById("__nct_base__");
        const bridgeEl = document.getElementById("__nct_bridge__");
        if (bridgeEl) bridgeEl.remove();

        const SAFE_KEY = /^--[a-zA-Z0-9-]+$/;
        const UNSAFE_VAL = /[{}<>;\r\n]/;

        let instanceId = "";
        let rendered = false;
        let fullscreen = false;
        let lastHeight = 0;
        let rafId = 0;

        function applyTheme(theme, colorScheme, fontSize) {
          if (!themeEl) return;
          const decls = [];
          const scheme = colorScheme === "light" ? "light" : "dark";
          decls.push(`color-scheme: ${scheme}`);
          if (
            typeof fontSize === "string" &&
            !UNSAFE_VAL.test(fontSize) &&
            fontSize.trim() !== ""
          ) {
            decls.push(`--nct-fs: ${fontSize.trim()}`);
          }
          if (theme && typeof theme === "object") {
            for (const [k, v] of Object.entries(theme)) {
              if (SAFE_KEY.test(k) && typeof v === "string" && !UNSAFE_VAL.test(v)) {
                decls.push(`${k}: ${v.trim()}`);
              }
            }
          }
          themeEl.textContent = `:root { ${decls.join("; ")}; }`;
        }

        function measureAndReport() {
          rafId = 0;
          if (!rendered || fullscreen) return;
          const docEl = document.documentElement;
          const body = document.body;
          if (!docEl) return;
          const docRect = docEl.getBoundingClientRect();
          const bodyRect = body ? body.getBoundingClientRect() : { height: 0, top: 0 };
          const natural = Math.ceil(Math.max(docRect.height, bodyRect.bottom - docRect.top));
          if (natural > 0 && Math.abs(natural - lastHeight) >= 1) {
            lastHeight = natural;
            window.parent.postMessage(
              { type: "nocturne:inline-html:resize", id: instanceId, height: natural },
              "*",
            );
          }
        }

        function scheduleMeasure() {
          if (!rendered || fullscreen || rafId !== 0) return;
          rafId = requestAnimationFrame(measureAndReport);
        }

        function cloneAndRunScripts(root) {
          const scripts = Array.from(root.querySelectorAll("script"));
          for (const oldScript of scripts) {
            const next = document.createElement("script");
            for (const attr of Array.from(oldScript.attributes)) {
              next.setAttribute(attr.name, attr.value);
            }
            next.textContent = oldScript.textContent;
            oldScript.replaceWith(next);
          }
        }

        let pageRequestId = 0;
        const pageRequests = new Map();

        function installPageBridge() {
          const request = (method, fields) =>
            new Promise((resolve, reject) => {
              const requestId = ++pageRequestId;
              pageRequests.set(requestId, { resolve, reject });
              try {
                window.parent.postMessage(
                  {
                    type: "nocturne:inline-html:request",
                    id: instanceId,
                    requestId,
                    method,
                    ...fields,
                  },
                  "*",
                );
              } catch (error) {
                pageRequests.delete(requestId);
                reject(error);
              }
            });
          Object.defineProperty(window, "nocturne", {
            value: Object.freeze({
              storage: Object.freeze({
                get: (key) => request("get", { key }),
                set: async (key, value) => {
                  const json = JSON.stringify(value);
                  if (json === undefined) throw new TypeError("页面数据值必须能序列化为 JSON");
                  return request("set", { key, value: JSON.parse(json) });
                },
                delete: (key) => request("delete", { key }),
                keys: () => request("keys", {}),
              }),
              ask: (prompt, { system, maxTokens } = {}) =>
                request("ask", { prompt, system, maxTokens }),
            }),
            writable: false,
            configurable: false,
          });
        }

        function renderHtml(payload) {
          if (rendered) return;
          rendered = true;
          instanceId = typeof payload.id === "string" ? payload.id : "";
          fullscreen = payload.fullscreen === true;
          if (payload.pageBridge === true) installPageBridge();
          if (fullscreen) {
            document.documentElement.setAttribute("data-nct-fullscreen", "true");
          }
          applyTheme(payload.theme, payload.colorScheme, payload.fontSize);

          const raw = typeof payload.html === "string" ? payload.html : "";
          const parsed = new DOMParser().parseFromString(raw, "text/html");

          for (const attr of Array.from(parsed.documentElement.attributes)) {
            if (attr.name !== "data-nct-fullscreen") {
              document.documentElement.setAttribute(attr.name, attr.value);
            }
          }
          for (const attr of Array.from(parsed.body.attributes)) {
            document.body.setAttribute(attr.name, attr.value);
          }

          const headNodes = Array.from(parsed.head.childNodes);
          for (const node of headNodes) {
            if (
              node.nodeType === Node.ELEMENT_NODE &&
              node.nodeName === "META" &&
              (node.getAttribute("charset") !== null ||
                (node.getAttribute("name") || "").toLowerCase() === "viewport")
            ) {
              continue;
            }
            document.head.appendChild(document.adoptNode(node));
          }

          document.body.replaceChildren();
          for (const node of Array.from(parsed.body.childNodes)) {
            document.body.appendChild(document.adoptNode(node));
          }

          if (themeEl && themeEl.parentNode !== document.head) {
            document.head.prepend(themeEl);
          }
          if (baseEl && baseEl.parentNode !== document.head) {
            themeEl?.after(baseEl);
          }

          cloneAndRunScripts(document.head);
          cloneAndRunScripts(document.body);

          try {
            document.dispatchEvent(new Event("DOMContentLoaded", { bubbles: true }));
            window.dispatchEvent(new Event("load"));
          } catch {
            // ignore user listener errors
          }

          if (commentMode || commentPins.length > 0) {
            ensureCommentUi();
            renderCommentPins();
          }

          if (!fullscreen) {
            if (typeof ResizeObserver !== "undefined") {
              const ro = new ResizeObserver(scheduleMeasure);
              ro.observe(document.documentElement);
              if (document.body) ro.observe(document.body);
            }
            if (typeof MutationObserver !== "undefined") {
              const mo = new MutationObserver(scheduleMeasure);
              mo.observe(document.documentElement, {
                childList: true,
                subtree: true,
                attributes: true,
                characterData: true,
              });
            }
            document.addEventListener("load", scheduleMeasure, true);
            window.addEventListener("resize", scheduleMeasure);
            measureAndReport();
            scheduleMeasure();
          }
        }

        const DEFAULT_CAPTURE_SCALE = 2;
        const CAPTURE_PADDING = 24;
        const MAX_CANVAS_DIM = 16384;
        const MAX_CANVAS_AREA = 67108864;
        const SVG_NS = "http://www.w3.org/2000/svg";
        const REPLACED_TAGS = new Set([
          "IMG",
          "SVG",
          "CANVAS",
          "VIDEO",
          "PICTURE",
          "IFRAME",
          "INPUT",
          "TEXTAREA",
          "SELECT",
          "BUTTON",
        ]);
        const NON_TRAVERSED_TAGS = new Set([
          "HEAD",
          "SCRIPT",
          "NOSCRIPT",
          "STYLE",
          "LINK",
          "META",
          "TITLE",
          "TEMPLATE",
        ]);
        const LEAF_REPLACED_TAGS = new Set([
          "IMG",
          "SVG",
          "CANVAS",
          "VIDEO",
          "IFRAME",
          "INPUT",
          "TEXTAREA",
          "SELECT",
        ]);
        const HTML_COMPUTED_PROPS = [
          "color",
          "background-color",
          "background-image",
          "background-position",
          "background-size",
          "background-repeat",
          "background-clip",
          "background-origin",
          "font-family",
          "font-size",
          "font-weight",
          "font-style",
          "font-variant",
          "line-height",
          "letter-spacing",
          "text-align",
          "text-decoration-line",
          "text-decoration-color",
          "text-decoration-style",
          "text-transform",
          "white-space",
          "word-break",
          "overflow-wrap",
          "opacity",
          "visibility",
          "border-top-color",
          "border-right-color",
          "border-bottom-color",
          "border-left-color",
          "box-shadow",
          "color-scheme",
        ];
        const SVG_COMPUTED_PROPS = [
          "fill",
          "fill-opacity",
          "fill-rule",
          "stroke",
          "stroke-width",
          "stroke-opacity",
          "stroke-dasharray",
          "stroke-dashoffset",
          "stroke-linecap",
          "stroke-linejoin",
          "opacity",
          "visibility",
          "color",
          "font-family",
          "font-size",
          "font-weight",
          "font-style",
          "text-anchor",
          "dominant-baseline",
          "letter-spacing",
        ];
        const CANVAS_REPLACE_PROPS = [
          "display",
          "box-sizing",
          "margin-top",
          "margin-right",
          "margin-bottom",
          "margin-left",
          "padding-top",
          "padding-right",
          "padding-bottom",
          "padding-left",
          "border-top-width",
          "border-right-width",
          "border-bottom-width",
          "border-left-width",
          "border-top-style",
          "border-right-style",
          "border-bottom-style",
          "border-left-style",
          "border-top-color",
          "border-right-color",
          "border-bottom-color",
          "border-left-color",
          "border-top-left-radius",
          "border-top-right-radius",
          "border-bottom-right-radius",
          "border-bottom-left-radius",
          "background-color",
          "box-shadow",
          "opacity",
          "visibility",
          "position",
          "top",
          "right",
          "bottom",
          "left",
          "transform",
          "transform-origin",
          "vertical-align",
          "flex-grow",
          "flex-shrink",
          "flex-basis",
          "align-self",
          "justify-self",
          "grid-column-start",
          "grid-column-end",
          "grid-row-start",
          "grid-row-end",
          "max-width",
          "max-height",
          "min-width",
          "min-height",
        ];

        function isTransparentColor(color) {
          if (!color || color === "transparent") return true;
          const slash = color.match(/\/\s*([\d.]+)(%?)\s*\)$/);
          if (slash) return parseFloat(slash[1]) === 0;
          const m = color.match(/^rgba?\(([^)]+)\)$/i);
          if (!m) return false;
          const parts = m[1].split(",").map((s) => s.trim());
          return parts.length >= 4 && parseFloat(parts[3]) === 0;
        }

        function hasBackgroundImage(cs) {
          const bgImg = cs.backgroundImage;
          if (!bgImg || bgImg === "none") return false;
          return !/^(?:\s*none\s*,)*\s*none\s*$/i.test(bgImg);
        }

        function hasVisibleBorder(cs) {
          for (const side of ["Top", "Right", "Bottom", "Left"]) {
            const width = parseFloat(cs[`border${side}Width`]);
            if (!(width > 0)) continue;
            const style = cs[`border${side}Style`];
            if (!style || style === "none" || style === "hidden") continue;
            if (!isTransparentColor(cs[`border${side}Color`])) return true;
          }
          return false;
        }

        function hasBoxShadowOrOutline(cs) {
          if (cs.boxShadow && cs.boxShadow !== "none") return true;
          const outlineWidth = parseFloat(cs.outlineWidth);
          const outlineStyle = cs.outlineStyle;
          return (
            outlineWidth > 0 &&
            Boolean(outlineStyle) &&
            outlineStyle !== "none" &&
            !isTransparentColor(cs.outlineColor)
          );
        }

        function isPaintedElement(tag, cs) {
          if (REPLACED_TAGS.has(tag)) return true;
          if (!isTransparentColor(cs.backgroundColor)) return true;
          if (hasBackgroundImage(cs)) return true;
          if (hasVisibleBorder(cs)) return true;
          if (hasBoxShadowOrOutline(cs)) return true;
          return false;
        }

        function computeCaptureBounds(docEl, body, docWidth, docHeight) {
          const full = { x: 0, y: 0, width: docWidth, height: docHeight };
          const docStyle = getComputedStyle(docEl);
          const bodyStyle = getComputedStyle(body);
          if (hasBackgroundImage(docStyle) || hasBackgroundImage(bodyStyle)) {
            return full;
          }

          const scrollX = window.scrollX || window.pageXOffset || docEl.scrollLeft || 0;
          const scrollY = window.scrollY || window.pageYOffset || docEl.scrollTop || 0;

          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;

          function includeRect(rect) {
            if (!rect || !(rect.width > 0) || !(rect.height > 0)) return;
            const left = rect.left + scrollX;
            const top = rect.top + scrollY;
            const right = rect.right + scrollX;
            const bottom = rect.bottom + scrollY;
            if (left < minX) minX = left;
            if (top < minY) minY = top;
            if (right > maxX) maxX = right;
            if (bottom > maxY) maxY = bottom;
          }

          const range = document.createRange();

          function walk(node, isRootContainer) {
            if (node.nodeType !== Node.ELEMENT_NODE) return;
            if (node.hasAttribute(COMMENT_UI_ATTR)) return;
            const tag = node.tagName.toUpperCase();
            if (NON_TRAVERSED_TAGS.has(tag)) return;

            const cs = isRootContainer ? bodyStyle : getComputedStyle(node);
            if (cs.display === "none") return;

            const isHidden = cs.visibility === "hidden" || cs.visibility === "collapse";

            if (!isRootContainer && !isHidden && isPaintedElement(tag, cs)) {
              includeRect(node.getBoundingClientRect());
            }

            if (!isRootContainer && LEAF_REPLACED_TAGS.has(tag)) {
              return;
            }

            for (const child of node.childNodes) {
              if (child.nodeType === Node.TEXT_NODE) {
                if (isHidden) continue;
                if (!child.nodeValue || !/\S/.test(child.nodeValue)) continue;
                range.selectNodeContents(child);
                for (const rect of range.getClientRects()) {
                  includeRect(rect);
                }
              } else if (child.nodeType === Node.ELEMENT_NODE) {
                walk(child, false);
              }
            }
          }

          walk(body, true);

          if (!Number.isFinite(minX)) {
            return full;
          }

          const x = Math.max(0, Math.floor(minX - CAPTURE_PADDING));
          const y = Math.max(0, Math.floor(minY - CAPTURE_PADDING));
          const right = Math.min(docWidth, Math.ceil(maxX + CAPTURE_PADDING));
          const bottom = Math.min(docHeight, Math.ceil(maxY + CAPTURE_PADDING));
          if (right <= x || bottom <= y) {
            return full;
          }
          return { x, y, width: right - x, height: bottom - y };
        }

        function resolveCaptureBackground() {
          const bodyBg = document.body ? getComputedStyle(document.body).backgroundColor : "";
          if (!isTransparentColor(bodyBg)) return bodyBg;
          const rootStyle = document.documentElement
            ? getComputedStyle(document.documentElement)
            : null;
          if (rootStyle) {
            const rootBg = rootStyle.backgroundColor;
            if (!isTransparentColor(rootBg)) return rootBg;
            const varBg = rootStyle.getPropertyValue("--bg").trim();
            if (varBg && !isTransparentColor(varBg)) return varBg;
          }
          return "transparent";
        }

        function loadImage(src) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("image load failed"));
            img.src = src;
          });
        }

        function imageElementToDataUrl(imgEl) {
          const w = imgEl.naturalWidth || imgEl.width;
          const h = imgEl.naturalHeight || imgEl.height;
          if (!w || !h) return null;
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const ctx = c.getContext("2d");
          if (!ctx) return null;
          ctx.drawImage(imgEl, 0, 0, w, h);
          return c.toDataURL("image/png");
        }

        async function blobUrlToDataUrl(url, blobCache, existingImg) {
          if (blobCache.has(url)) return blobCache.get(url);
          try {
            let img = existingImg;
            if (!img || !img.complete || img.naturalWidth === 0) {
              img = await loadImage(url);
            }
            const dataUrl = imageElementToDataUrl(img);
            if (dataUrl) {
              blobCache.set(url, dataUrl);
              return dataUrl;
            }
          } catch {
            // ignore unreadable blob image
          }
          return null;
        }

        async function replaceBlobUrlsInCss(cssText, blobCache) {
          if (!cssText || !cssText.includes("blob:")) return cssText;
          const re = /url\(\s*(['"]?)(blob:[^)'"]+)\1\s*\)/gi;
          const matches = Array.from(cssText.matchAll(re));
          if (matches.length === 0) return cssText;
          let out = "";
          let last = 0;
          for (const m of matches) {
            out += cssText.slice(last, m.index);
            const dataUrl = await blobUrlToDataUrl(m[2], blobCache);
            out += dataUrl ? `url("${dataUrl}")` : m[0];
            last = m.index + m[0].length;
          }
          out += cssText.slice(last);
          return out;
        }

        function resolveViewportUnits(cssText, vw, vh) {
          return cssText.replace(/(-?\d*\.?\d+)(?:d|s|l)?v(h|w)\b/gi, (_, num, axis) => {
            const base = axis.toLowerCase() === "h" ? vh : vw;
            return `${((parseFloat(num) * base) / 100).toFixed(2)}px`;
          });
        }

        async function collectStylesheets(vw, vh, blobCache) {
          const parts = [];
          const sheets = Array.from(document.styleSheets || []);
          if (Array.isArray(document.adoptedStyleSheets)) {
            for (const s of document.adoptedStyleSheets) sheets.push(s);
          }
          for (const sheet of sheets) {
            if (
              sheet.ownerNode &&
              typeof sheet.ownerNode.hasAttribute === "function" &&
              sheet.ownerNode.hasAttribute(COMMENT_UI_ATTR)
            ) {
              continue;
            }
            try {
              const rules = sheet.cssRules;
              if (rules) {
                for (const rule of Array.from(rules)) {
                  parts.push(rule.cssText);
                }
              }
            } catch {
              if (sheet.ownerNode && typeof sheet.ownerNode.textContent === "string") {
                parts.push(sheet.ownerNode.textContent);
              }
            }
          }
          let text = resolveViewportUnits(parts.join("\n"), vw, vh);
          text = await replaceBlobUrlsInCss(text, blobCache);
          text +=
            "\n*, *::before, *::after { animation: none !important; transition: none !important; }";
          return text;
        }

        function bytesToBase64(bytes) {
          let bin = "";
          const chunk = 0x8000;
          for (let i = 0; i < bytes.length; i += chunk) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
          }
          return btoa(bin);
        }

        async function syncClonedSubtree(origEl, cloneEl, blobCache) {
          if (origEl.hasAttribute && origEl.hasAttribute(COMMENT_UI_ATTR)) {
            return;
          }
          const tag = origEl.tagName.toUpperCase();
          if (
            tag === "HEAD" ||
            tag === "SCRIPT" ||
            tag === "NOSCRIPT" ||
            tag === "STYLE" ||
            tag === "LINK" ||
            tag === "META" ||
            tag === "TITLE"
          ) {
            return;
          }

          if (tag === "CANVAS" && origEl.namespaceURI !== SVG_NS) {
            const img = document.createElement("img");
            for (const attr of Array.from(origEl.attributes)) {
              const name = attr.name.toLowerCase();
              if (name !== "width" && name !== "height" && name !== "style") {
                img.setAttribute(attr.name, attr.value);
              }
            }
            const cs = getComputedStyle(origEl);
            const rect = origEl.getBoundingClientRect();
            const decls = [];
            for (const prop of CANVAS_REPLACE_PROPS) {
              const val = cs.getPropertyValue(prop);
              if (val) decls.push(`${prop}:${val}`);
            }
            const cssW = cs.width && cs.width !== "auto" ? cs.width : `${rect.width}px`;
            const cssH = cs.height && cs.height !== "auto" ? cs.height : `${rect.height}px`;
            decls.push(`width:${cssW}`);
            decls.push(`height:${cssH}`);
            img.setAttribute("style", decls.join(";"));
            try {
              const dataUrl = origEl.toDataURL("image/png");
              if (dataUrl && dataUrl !== "data:,") {
                img.setAttribute("src", dataUrl);
              }
            } catch {
              // tainted or unreadable canvas; leave empty placeholder
            }
            cloneEl.replaceWith(img);
            return;
          }

          if (tag === "IMG" && origEl.namespaceURI !== SVG_NS) {
            const src = origEl.currentSrc || origEl.getAttribute("src") || "";
            if (src.startsWith("blob:")) {
              const dataUrl = await blobUrlToDataUrl(src, blobCache, origEl);
              if (dataUrl) {
                cloneEl.setAttribute("src", dataUrl);
                cloneEl.removeAttribute("srcset");
              }
            }
          } else if (tag === "IMAGE" && origEl.namespaceURI === SVG_NS) {
            const href =
              origEl.getAttribute("href") ||
              origEl.getAttributeNS("http://www.w3.org/1999/xlink", "href") ||
              "";
            if (href.startsWith("blob:")) {
              const dataUrl = await blobUrlToDataUrl(href, blobCache);
              if (dataUrl) {
                cloneEl.setAttribute("href", dataUrl);
                if (cloneEl.hasAttributeNS("http://www.w3.org/1999/xlink", "href")) {
                  cloneEl.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", dataUrl);
                }
              }
            }
          } else if (tag === "INPUT" && origEl.namespaceURI !== SVG_NS) {
            const type = (origEl.type || "").toLowerCase();
            if (type === "checkbox" || type === "radio") {
              if (origEl.checked) cloneEl.setAttribute("checked", "");
              else cloneEl.removeAttribute("checked");
            } else {
              cloneEl.setAttribute("value", origEl.value);
            }
          } else if (tag === "TEXTAREA" && origEl.namespaceURI !== SVG_NS) {
            cloneEl.textContent = origEl.value;
          } else if (tag === "OPTION" && origEl.namespaceURI !== SVG_NS) {
            if (origEl.selected) cloneEl.setAttribute("selected", "");
            else cloneEl.removeAttribute("selected");
          }

          const isSvg = origEl.namespaceURI === SVG_NS;
          const cs = getComputedStyle(origEl);
          const props = isSvg ? SVG_COMPUTED_PROPS : HTML_COMPUTED_PROPS;
          const decls = [];
          const existing = origEl.getAttribute("style");
          if (existing) decls.push(existing);
          for (const prop of props) {
            let val = cs.getPropertyValue(prop);
            if (!val) continue;
            if (prop === "background-image" && val.includes("blob:")) {
              val = await replaceBlobUrlsInCss(val, blobCache);
            }
            decls.push(`${prop}:${val}`);
          }
          if (isSvg && tag === "SVG" && origEl.parentElement?.namespaceURI !== SVG_NS) {
            const rect = origEl.getBoundingClientRect();
            if (rect.width > 0 && rect.height > 0) {
              decls.push(`width:${rect.width}px`);
              decls.push(`height:${rect.height}px`);
            }
          }
          if (decls.length > 0) {
            cloneEl.setAttribute("style", decls.join(";"));
          }

          const origChildren = origEl.children;
          const cloneChildren = cloneEl.children;
          const len = Math.min(origChildren.length, cloneChildren.length);
          for (let i = 0; i < len; i += 1) {
            await syncClonedSubtree(origChildren[i], cloneChildren[i], blobCache);
          }
        }

        function clampCaptureRegion(region, docWidth, docHeight) {
          if (
            !region ||
            typeof region !== "object" ||
            !Number.isFinite(region.x) ||
            !Number.isFinite(region.y) ||
            !Number.isFinite(region.width) ||
            !Number.isFinite(region.height) ||
            region.width <= 0 ||
            region.height <= 0
          ) {
            return null;
          }
          const width = Math.min(Math.ceil(region.width), docWidth);
          const height = Math.min(Math.ceil(region.height), docHeight);
          const x = Math.max(0, Math.min(Math.floor(region.x), Math.max(0, docWidth - width)));
          const y = Math.max(0, Math.min(Math.floor(region.y), Math.max(0, docHeight - height)));
          return { x, y, width: Math.max(1, width), height: Math.max(1, height) };
        }

        async function captureDocument(region) {
          if (document.fonts && document.fonts.ready) {
            try {
              await document.fonts.ready;
            } catch {
              // ignore font loading errors
            }
          }

          const docEl = document.documentElement;
          const body = document.body;
          if (!docEl || !body) throw new Error("document not ready");

          const docWidth = Math.ceil(
            Math.max(docEl.scrollWidth, body.scrollWidth, docEl.clientWidth, 1),
          );
          const docHeight = Math.ceil(
            Math.max(docEl.scrollHeight, body.scrollHeight, docEl.clientHeight, 1),
          );
          const bounds =
            clampCaptureRegion(region, docWidth, docHeight) ??
            computeCaptureBounds(docEl, body, docWidth, docHeight);

          let scale = DEFAULT_CAPTURE_SCALE;
          if (bounds.width * scale > MAX_CANVAS_DIM) {
            scale = Math.min(scale, MAX_CANVAS_DIM / bounds.width);
          }
          if (bounds.height * scale > MAX_CANVAS_DIM) {
            scale = Math.min(scale, MAX_CANVAS_DIM / bounds.height);
          }
          if (bounds.width * bounds.height * scale * scale > MAX_CANVAS_AREA) {
            scale = Math.min(scale, Math.sqrt(MAX_CANVAS_AREA / (bounds.width * bounds.height)));
          }
          const canvasWidth = Math.max(1, Math.floor(bounds.width * scale));
          const canvasHeight = Math.max(1, Math.floor(bounds.height * scale));

          const bgColor = resolveCaptureBackground();
          const blobCache = new Map();
          const collectedCss = await collectStylesheets(
            docEl.clientWidth || docWidth,
            docEl.clientHeight || window.innerHeight || docHeight,
            blobCache,
          );

          const cloneRoot = docEl.cloneNode(true);
          await syncClonedSubtree(docEl, cloneRoot, blobCache);
          cloneRoot.removeAttribute("data-nct-comment-mode");

          for (const el of Array.from(
            cloneRoot.querySelectorAll(
              `script, noscript, style, link, [${COMMENT_UI_ATTR}="true"]`,
            ),
          )) {
            el.remove();
          }

          let cloneHead = cloneRoot.querySelector("head");
          if (!cloneHead) {
            cloneHead = document.createElement("head");
            cloneRoot.prepend(cloneHead);
          }
          const styleEl = document.createElement("style");
          styleEl.id = "__nct_capture_styles__";
          styleEl.textContent = collectedCss;
          cloneHead.appendChild(styleEl);

          cloneRoot.style.width = `${docWidth}px`;
          cloneRoot.style.height = `${docHeight}px`;
          cloneRoot.style.minHeight = `${docHeight}px`;
          cloneRoot.style.margin = "0";
          cloneRoot.style.overflow = "hidden";
          if (bgColor !== "transparent") {
            cloneRoot.style.backgroundColor = bgColor;
          }
          const cloneBody = cloneRoot.querySelector("body");
          if (cloneBody) {
            cloneBody.style.minHeight = `${docHeight}px`;
          }

          const serialized = new XMLSerializer().serializeToString(cloneRoot);
          const svg =
            `<svg xmlns="http://www.w3.org/2000/svg" width="${canvasWidth}" height="${canvasHeight}" viewBox="${bounds.x} ${bounds.y} ${bounds.width} ${bounds.height}">` +
            `<foreignObject x="0" y="0" width="${docWidth}" height="${docHeight}">${serialized}</foreignObject>` +
            `</svg>`;
          const svgBytes = new TextEncoder().encode(svg);
          const svgUrl = `data:image/svg+xml;base64,${bytesToBase64(svgBytes)}`;
          const img = await loadImage(svgUrl);

          const canvas = document.createElement("canvas");
          canvas.width = canvasWidth;
          canvas.height = canvasHeight;
          const ctx = canvas.getContext("2d");
          if (!ctx) throw new Error("2d context unavailable");
          if (bgColor !== "transparent") {
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
          }
          ctx.drawImage(img, 0, 0, canvasWidth, canvasHeight);

          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
              (result) => (result ? resolve(result) : reject(new Error("png encode failed"))),
              "image/png",
            );
          });
          return blob.arrayBuffer();
        }

        async function handleCapture(requestId, region) {
          try {
            const png = await captureDocument(region);
            window.parent.postMessage(
              { type: "nocturne:inline-html:captured", id: instanceId, requestId, png },
              "*",
              [png],
            );
          } catch (err) {
            window.parent.postMessage(
              {
                type: "nocturne:inline-html:captured",
                id: instanceId,
                requestId,
                error: err instanceof Error ? err.message : String(err),
              },
              "*",
            );
          }
        }

        // ---- 面板页面评论层（ADR-0113） ----
        const COMMENT_UI_ATTR = "data-nct-comment-ui";
        const COMMENT_TEXT_MAX = 200;
        const COMMENT_EMPTY_TEXT_TAGS = new Set(["IMG", "CANVAS", "VIDEO", "AUDIO", "HR", "BR"]);
        const COMMENT_SKIP_TEXT_TAGS = new Set(["SCRIPT", "STYLE", "NOSCRIPT", "TEMPLATE"]);
        let commentMode = false;
        let commentPins = [];
        let commentLayer = null;
        let commentHoverEl = null;
        let dragStart = null;
        let preMouseDownSelection = null;
        let suppressNextClick = false;

        function isInsideCommentUi(node) {
          let cur = node && node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
          while (cur && cur.nodeType === Node.ELEMENT_NODE) {
            if (cur.hasAttribute(COMMENT_UI_ATTR)) return true;
            cur = cur.parentElement;
          }
          return false;
        }

        function ensureCommentUi() {
          if (!document.getElementById("__nct_comment_style__")) {
            const style = document.createElement("style");
            style.id = "__nct_comment_style__";
            style.setAttribute(COMMENT_UI_ATTR, "true");
            style.textContent = [
              ':root[data-nct-comment-mode="true"], :root[data-nct-comment-mode="true"] * { cursor: crosshair !important; }',
              "#__nct_comment_layer__ { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: visible; pointer-events: none; z-index: 2147483647; }",
              "#__nct_comment_hover__ { position: fixed; pointer-events: none; display: none; border: 1.5px solid var(--accent, #c4683b); background: color-mix(in srgb, var(--accent, #c4683b) 10%, transparent); border-radius: 4px; box-sizing: border-box; z-index: 2147483646; }",
              ".nct-comment-pin { position: absolute; width: 22px; height: 22px; margin: 0; padding: 0; border-radius: 11px 11px 11px 2px; background: var(--accent, #c4683b); color: var(--bg, #ffffff); border: 2px solid var(--bg, #ffffff); box-shadow: 0 2px 6px rgba(0,0,0,0.22); font: 600 11px/1 var(--sans, system-ui, sans-serif); display: flex; align-items: center; justify-content: center; cursor: pointer !important; pointer-events: auto; transform: translate(-2px, -20px); box-sizing: border-box; transition: transform 100ms ease; }",
              '.nct-comment-pin:hover, .nct-comment-pin[data-active="true"] { transform: translate(-2px, -20px) scale(1.1); }',
              '.nct-comment-pin[data-active="true"] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent, #c4683b) 28%, transparent), 0 2px 6px rgba(0,0,0,0.22); }',
            ].join("\n");
            document.head.appendChild(style);
          }
          if (!commentHoverEl || !commentHoverEl.isConnected) {
            commentHoverEl = document.createElement("div");
            commentHoverEl.id = "__nct_comment_hover__";
            commentHoverEl.setAttribute(COMMENT_UI_ATTR, "true");
            document.documentElement.appendChild(commentHoverEl);
          }
          if (!commentLayer || !commentLayer.isConnected) {
            commentLayer = document.createElement("div");
            commentLayer.id = "__nct_comment_layer__";
            commentLayer.setAttribute(COMMENT_UI_ATTR, "true");
            document.documentElement.appendChild(commentLayer);
          }
        }

        function hideCommentHover() {
          if (commentHoverEl) commentHoverEl.style.display = "none";
        }

        function resolveCommentPinPosition(pin) {
          if (!pin.relocate) return pin;
          let target;
          if (typeof pin.path === "string" && pin.path !== "") {
            try {
              target = document.querySelector(pin.path);
            } catch {
              // Older selectors can be invalid for the current document.
            }
          }
          const hasBox = (el) => el && !isInsideCommentUi(el) && el.getClientRects().length > 0;
          if (!hasBox(target) && typeof pin.text === "string" && pin.text !== "") {
            const candidates = Array.from(document.body.querySelectorAll("*")).reverse();
            let substringMatch;
            for (const el of candidates) {
              if (!hasBox(el)) continue;
              const text = extractVisibleText(el);
              if (text === pin.text) {
                target = el;
                break;
              }
              if (!substringMatch && text.includes(pin.text)) substringMatch = el;
            }
            if (!hasBox(target)) target = substringMatch;
          }
          if (!hasBox(target)) return pin;
          const rect = target.getBoundingClientRect();
          return { x: rect.left + rect.width / 2 + window.scrollX, y: rect.top + window.scrollY };
        }

        function renderCommentPins() {
          if (commentPins.length === 0 && !commentLayer) return;
          ensureCommentUi();
          commentLayer.replaceChildren();
          for (const pin of commentPins) {
            if (
              !pin ||
              typeof pin.id !== "string" ||
              !Number.isFinite(pin.x) ||
              !Number.isFinite(pin.y)
            ) {
              continue;
            }
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "nct-comment-pin";
            btn.setAttribute(COMMENT_UI_ATTR, "true");
            btn.setAttribute("data-pin-id", pin.id);
            btn.setAttribute("aria-label", `评论 ${pin.number}`);
            if (pin.active) btn.setAttribute("data-active", "true");
            const { x, y } = resolveCommentPinPosition(pin);
            btn.style.left = `${Math.round(x)}px`;
            btn.style.top = `${Math.round(y)}px`;
            btn.textContent = String(pin.number);
            commentLayer.appendChild(btn);
          }
        }

        function setCommentMode(enabled) {
          commentMode = Boolean(enabled);
          if (commentMode) {
            ensureCommentUi();
            document.documentElement.setAttribute("data-nct-comment-mode", "true");
          } else {
            document.documentElement.removeAttribute("data-nct-comment-mode");
            hideCommentHover();
            dragStart = null;
            preMouseDownSelection = null;
          }
        }

        function setCommentPins(pins) {
          commentPins = pins;
          renderCommentPins();
        }

        function escapeCssIdent(ident) {
          if (typeof CSS !== "undefined" && typeof CSS.escape === "function") {
            return CSS.escape(ident);
          }
          return String(ident)
            .replace(/^([0-9])/, "\\3$1 ")
            .replace(/([^\w-])/g, "\\$1");
        }

        function computeElementPath(el) {
          if (!el || el === document.body || el === document.documentElement) {
            return "body";
          }
          const segments = [];
          let cur = el;
          while (cur && cur !== document.body && cur !== document.documentElement) {
            if (cur.id) {
              segments.push(`#${escapeCssIdent(cur.id)}`);
            } else {
              const tag = cur.tagName.toLowerCase();
              let idx = 1;
              let sib = cur.previousElementSibling;
              while (sib) {
                if (sib.tagName.toLowerCase() === tag) idx += 1;
                sib = sib.previousElementSibling;
              }
              segments.push(`${tag}:nth-of-type(${idx})`);
            }
            cur = cur.parentElement;
          }
          segments.push("body");
          segments.reverse();
          return segments.join(" > ");
        }

        function isHiddenElement(el) {
          if (!el || el.nodeType !== Node.ELEMENT_NODE) return false;
          if (el.hasAttribute(COMMENT_UI_ATTR)) return true;
          try {
            const cs = getComputedStyle(el);
            if (cs.display === "none" || cs.visibility === "hidden") return true;
          } catch {
            // ignore
          }
          return false;
        }

        function collectTextFromNode(node, parts) {
          if (node.nodeType === Node.TEXT_NODE) {
            if (node.nodeValue) parts.push(node.nodeValue);
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          if (isHiddenElement(node)) return;
          const tag = node.tagName.toUpperCase();
          if (COMMENT_SKIP_TEXT_TAGS.has(tag) || COMMENT_EMPTY_TEXT_TAGS.has(tag)) return;
          if (node.namespaceURI === SVG_NS) {
            if (tag === "TEXT" || tag === "TSPAN") {
              for (const child of node.childNodes) collectTextFromNode(child, parts);
              return;
            }
            if (tag === "SVG" || tag === "G") {
              for (const child of node.childNodes) collectTextFromNode(child, parts);
            }
            return;
          }
          for (const child of node.childNodes) collectTextFromNode(child, parts);
        }

        function extractVisibleText(el) {
          if (!el || el.nodeType !== Node.ELEMENT_NODE) return "";
          const tag = el.tagName.toUpperCase();
          if (COMMENT_EMPTY_TEXT_TAGS.has(tag)) return "";
          if ((tag === "INPUT" || tag === "TEXTAREA") && el.namespaceURI !== SVG_NS) {
            if ((el.type || "").toLowerCase() === "password") return "";
            return String(el.value || "")
              .replace(/\s+/g, " ")
              .trim()
              .slice(0, COMMENT_TEXT_MAX);
          }
          if (el.namespaceURI === SVG_NS) {
            if (tag !== "TEXT" && tag !== "TSPAN" && tag !== "SVG" && tag !== "G") {
              return "";
            }
          }
          const parts = [];
          collectTextFromNode(el, parts);
          return parts.join(" ").replace(/\s+/g, " ").trim().slice(0, COMMENT_TEXT_MAX);
        }

        function resolvePickElement(node) {
          let el = node && node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
          if (!el || el.nodeType !== Node.ELEMENT_NODE) return document.body;
          if (el === document.documentElement) return document.body;
          return el;
        }

        function emitCommentPick(targetNode, clientX, clientY, selectedText) {
          const target = resolvePickElement(targetNode);
          if (!target) return;
          const scrollX = window.scrollX || document.documentElement.scrollLeft || 0;
          const scrollY = window.scrollY || document.documentElement.scrollTop || 0;
          const x = Math.round(clientX + scrollX);
          const y = Math.round(clientY + scrollY);
          const normalizedSelected =
            typeof selectedText === "string"
              ? selectedText.replace(/\s+/g, " ").trim().slice(0, COMMENT_TEXT_MAX)
              : "";
          const text = normalizedSelected !== "" ? normalizedSelected : extractVisibleText(target);
          window.parent.postMessage(
            {
              type: "nocturne:inline-html:comment-pick",
              id: instanceId,
              path: computeElementPath(target),
              text,
              x,
              y,
              hasVisibleText: text !== "",
              viewportX: Math.round(clientX),
              viewportY: Math.round(clientY),
            },
            "*",
          );
        }

        document.addEventListener(
          "mousemove",
          (event) => {
            if (!commentMode || !commentHoverEl) return;
            if (isInsideCommentUi(event.target)) {
              hideCommentHover();
              return;
            }
            const target = resolvePickElement(event.target);
            if (!target || target === document.body) {
              hideCommentHover();
              return;
            }
            const rect = target.getBoundingClientRect();
            if (!(rect.width > 0) || !(rect.height > 0)) {
              hideCommentHover();
              return;
            }
            commentHoverEl.style.left = `${rect.left}px`;
            commentHoverEl.style.top = `${rect.top}px`;
            commentHoverEl.style.width = `${rect.width}px`;
            commentHoverEl.style.height = `${rect.height}px`;
            commentHoverEl.style.display = "block";
          },
          true,
        );

        document.addEventListener("mouseleave", hideCommentHover, true);

        document.addEventListener(
          "mousedown",
          (event) => {
            if (!commentMode || event.button !== 0 || isInsideCommentUi(event.target)) return;
            dragStart = { x: event.clientX, y: event.clientY };
            preMouseDownSelection = null;
            const sel = window.getSelection();
            const selText = sel ? sel.toString().replace(/\s+/g, " ").trim() : "";
            if (sel && selText !== "" && sel.rangeCount > 0) {
              const rect = sel.getRangeAt(0).getBoundingClientRect();
              const pad = 16;
              if (
                event.clientX >= rect.left - pad &&
                event.clientX <= rect.right + pad &&
                event.clientY >= rect.top - pad &&
                event.clientY <= rect.bottom + pad
              ) {
                preMouseDownSelection = {
                  text: selText,
                  target: sel.getRangeAt(0).commonAncestorContainer,
                };
              }
            }
          },
          true,
        );

        document.addEventListener(
          "mouseup",
          (event) => {
            if (!commentMode || !dragStart) return;
            const start = dragStart;
            dragStart = null;
            const moved = Math.hypot(event.clientX - start.x, event.clientY - start.y);
            if (moved <= 4) return;
            const sel = window.getSelection();
            const selText = sel ? sel.toString().replace(/\s+/g, " ").trim() : "";
            if (sel && selText !== "" && sel.rangeCount > 0) {
              const anchor = sel.getRangeAt(0).commonAncestorContainer;
              suppressNextClick = true;
              setTimeout(() => {
                suppressNextClick = false;
              }, 0);
              preMouseDownSelection = null;
              emitCommentPick(anchor, event.clientX, event.clientY, selText);
            }
          },
          true,
        );

        document.addEventListener(
          "click",
          (event) => {
            const rawTarget =
              event.target && event.target.nodeType === Node.TEXT_NODE
                ? event.target.parentElement
                : event.target;
            const pinBtn =
              rawTarget && typeof rawTarget.closest === "function"
                ? rawTarget.closest(".nct-comment-pin")
                : null;
            if (pinBtn) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              const pinId = pinBtn.getAttribute("data-pin-id") || "";
              const rect = pinBtn.getBoundingClientRect();
              window.parent.postMessage(
                {
                  type: "nocturne:inline-html:comment-pin-click",
                  id: instanceId,
                  pinId,
                  viewportX: Math.round(rect.left + rect.width / 2),
                  viewportY: Math.round(rect.bottom),
                },
                "*",
              );
              return;
            }
            if (!commentMode) return;
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            if (suppressNextClick) {
              suppressNextClick = false;
              return;
            }
            if (isInsideCommentUi(event.target)) return;
            const sel = window.getSelection();
            const liveSel = sel ? sel.toString().replace(/\s+/g, " ").trim() : "";
            const chosenSel = liveSel !== "" ? liveSel : preMouseDownSelection?.text || "";
            const target =
              liveSel !== "" && sel && sel.rangeCount > 0
                ? sel.getRangeAt(0).commonAncestorContainer
                : preMouseDownSelection
                  ? preMouseDownSelection.target
                  : event.target;
            preMouseDownSelection = null;
            emitCommentPick(target, event.clientX, event.clientY, chosenSel);
          },
          true,
        );

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const data = event.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "nocturne:inline-html:render") {
            renderHtml(data);
          } else if (data.type === "nocturne:inline-html:response" && data.id === instanceId) {
            const request = pageRequests.get(data.requestId);
            if (!request) return;
            pageRequests.delete(data.requestId);
            if (data.ok === true) {
              request.resolve(data.value);
            } else {
              const error = new Error(data.error?.message);
              if (typeof data.error?.code === "string") error.code = data.error.code;
              request.reject(error);
            }
          } else if (data.type === "nocturne:inline-html:theme") {
            applyTheme(data.theme, data.colorScheme, data.fontSize);
            scheduleMeasure();
          } else if (data.type === "nocturne:inline-html:comment-mode") {
            if (data.id !== instanceId) return;
            setCommentMode(Boolean(data.enabled));
          } else if (data.type === "nocturne:inline-html:comment-pins") {
            if (data.id !== instanceId) return;
            setCommentPins(Array.isArray(data.pins) ? data.pins : []);
          } else if (data.type === "nocturne:inline-html:capture") {
            if (
              !rendered ||
              data.id !== instanceId ||
              typeof data.requestId !== "string" ||
              !data.requestId
            ) {
              return;
            }
            void handleCapture(data.requestId, data.region);
          }
        });

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            window.parent.postMessage({ type: "nocturne:inline-html:escape", id: instanceId }, "*");
          }
        });

        window.parent.postMessage({ type: "nocturne:inline-html:ready" }, "*");
      })();
    </script>
  </body>
</html>

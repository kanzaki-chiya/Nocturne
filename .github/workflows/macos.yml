name: macos

on:
  push:
    branches: [main, "macos/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - run: uname -m && test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          failed=()
          for pkg in packages/core packages/rpc packages/mcp apps/cli apps/tui; do
            if ! pnpm --dir "$pkg" test --maxWorkers=2; then
              failed+=("$pkg")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed packages: ${failed[*]}" >&2
            exit 1
          fi

  desktop:
    runs-on: macos-latest
    steps:
      - run: uname -m && test "$(uname -m)" = arm64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:build
      - run: bash scripts/smoke-desktop-macos.sh "$PWD/apps/desktop/src-tauri/target/release/bundle/macos/Nocturne.app" "$RUNNER_TEMP/nocturne.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nocturne-darwin-arm64
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/nocturne.png
          retention-days: 7
          if-no-files-found: error

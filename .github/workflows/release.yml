# 发布流水线（ADR-0050 第 4 节）：推送 v* 标签触发。
# 主任务在 windows-latest 上跑完整检查与 pnpm release:build，
# 产物（setup.exe、.sig、latest.json、nctrn tgz、中继 nocturne-relay tgz）经 gh release create 上传为草稿；
# android 任务构建签名 APK 并追加到同一草稿（ADR-0059）；
# ubuntu/macos 任务只对 tgz 做安装冒烟，结果追加进草稿说明。
# 用到的 secrets：GITHUB_TOKEN（内置）、TAURI_SIGNING_PRIVATE_KEY、
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD（更新包签名私钥，维护者配置）、
# ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、
# ANDROID_KEY_PASSWORD（安卓签名密钥，维护者配置）。
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  windows:
    name: 发布构建（windows-latest）
    runs-on: windows-latest
    permissions:
      contents: write # gh release create --draft 与资产上传
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format:check
        run: pnpm format:check

      - name: depcheck
        run: pnpm depcheck

      - name: build
        run: pnpm build

      - name: test
        run: pnpm test

      - name: 版本号与标签一致
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/release-version.mjs --check "$VERSION"

      - name: 发布构建（bundle → npm pack → 随附 Node → cargo test → tauri build → latest.json）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm release:build

      - name: tgz 安装冒烟（本机）
        shell: bash
        run: node scripts/smoke-nctrn.mjs "release/$VERSION/nctrn-$VERSION.tgz"

      - name: 中继 tgz 安装冒烟（本机）
        shell: bash
        run: node scripts/smoke-relay.mjs "release/$VERSION/nocturne-relay-$VERSION.tgz"

      - name: 创建草稿 Release 并上传产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          printf '\n- Windows 中继 tgz 冒烟：通过\n' >> "$RUNNER_TEMP/release-notes.md"
          # 预发布号（含 -）标成 prerelease：GitHub 的 latest 不含预发布，updater 端点
          # /releases/latest/download/latest.json 因而不会把 rc 推给正式版用户
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            "${prerelease[@]}" \
            --title "Nocturne $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/"$VERSION"/*

  # tgz 的跨平台安装冒烟：串行跑（max-parallel: 1），避免两条任务同时追加
  # 草稿说明互相覆盖。失败不阻塞已创建的草稿（草稿在 windows 任务里已建成）。
  smoke:
    name: tgz 冒烟（${{ matrix.os }}）
    needs: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # 下载草稿资产 + 把结果追加进草稿说明
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: 下载草稿 Release 里的 tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "nctrn-*.tgz" --pattern "nocturne-relay-*.tgz" --dir .

      - name: 安装冒烟
        id: smoke
        run: node scripts/smoke-nctrn.mjs ./nctrn-*.tgz

      - name: 中继安装冒烟
        id: relay-smoke
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        run: node scripts/smoke-relay.mjs ./nocturne-relay-*.tgz

      - name: 把结果追加进草稿 Release 说明
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RELAY_OUTCOME: ${{ steps.relay-smoke.outcome }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            mark="通过"
          else
            mark="失败"
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\n- %s tgz 安装冒烟：%s\n' "$RUNNER_OS" "$mark" >> "$RUNNER_TEMP/notes.md"
          if [ "$RELAY_OUTCOME" = "success" ]; then relay_mark="通过"; else relay_mark="失败"; fi
          printf '\n- %s 中继 tgz 冒烟：%s\n' "$RUNNER_OS" "$relay_mark" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  # 安卓 APK：等冒烟结束再追加草稿说明，避免互相覆盖；失败不影响已建成的草稿。
  # 没配置签名密钥时不附 APK，并在说明里写明。
  android:
    name: 安卓 APK
    needs: [windows, smoke]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 APK + 把结果追加进草稿说明
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 是否配置了签名密钥
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pnpm
        if: steps.signing.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装依赖
        if: steps.signing.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: 工具链
        if: steps.signing.outputs.ready == 'true'
        run: |
          rustup target add aarch64-linux-android
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: 写入签名配置
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/android/src-tauri/gen/android/keystore.properties

      - name: 构建工作区包
        if: steps.signing.outputs.ready == 'true'
        run: pnpm build

      - name: 构建 APK
        if: steps.signing.outputs.ready == 'true'
        run: pnpm android:build:release

      - name: 校验签名并上传
        id: upload
        if: steps.signing.outputs.ready == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="$RUNNER_TEMP/nocturne-$VERSION.apk"
          cp apps/android/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          gh release upload "$GITHUB_REF_NAME" "$APK"

      - name: 把结果追加进草稿说明
        if: ${{ !cancelled() }}
        env:
          READY: ${{ steps.signing.outputs.ready }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if [ "$READY" != "true" ]; then
            printf '\n- 安卓 APK：未配置签名密钥，未附带\n' >> "$RUNNER_TEMP/notes.md"
          elif [ "$UPLOAD" = "success" ]; then
            printf '\n- 安卓 APK：已构建并通过签名校验\n' >> "$RUNNER_TEMP/notes.md"
          else
            printf '\n- 安卓 APK：构建失败\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

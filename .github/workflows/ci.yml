# 持续集成：推送 main 与 Pull Request 时在 windows-latest 上跑完整检查，
# 步骤与发布流水线（release.yml）的检查部分一致，让只在干净检出才暴露的问题尽早出现。
# cargo test 依赖随附 Node 与打包后台，只在发布流水线里跑。
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查（windows-latest）
    runs-on: windows-latest
    steps:
      - name: 检出
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format:check
        run: pnpm format:check

      - name: depcheck
        run: pnpm depcheck

      - name: build
        run: pnpm build

      - name: test
        run: pnpm test

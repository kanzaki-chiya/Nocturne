<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{docs.title}} — Nocturne 文档</title>
    <link rel="canonical" href="{{docs.canonical}}" />
    <link rel="icon" href="{{docs.root}}assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{docs.root}}assets/base.css" />
    <link rel="stylesheet" href="{{docs.root}}assets/docs.css" />
  </head>
  <body id="top">
    <a class="skip-link" href="#main">跳至正文</a>
    <header class="masthead">
      <div class="wrap">
        <a class="wordmark" href="{{docs.root}}" aria-label="Nocturne 首页">
          <svg viewBox="143 143 738 738" aria-hidden="true">
            <defs>
              <linearGradient
                id="wordmark-moon-g"
                gradientUnits="userSpaceOnUse"
                x1="276"
                y1="232"
                x2="786"
                y2="802"
              >
                <stop offset=".1" stop-color="var(--moon)" />
                <stop offset=".9" stop-color="var(--moon-alt)" />
              </linearGradient>
              <clipPath id="wordmark-moon-clip">
                <path d="M499.1 212.3A300 300 0 1 0 792.1 619.5A252 252 0 0 1 499.1 212.3Z" />
              </clipPath>
            </defs>
            <g clip-path="url(#wordmark-moon-clip)">
              <rect x="0" y="210" width="1024" height="40.1" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="264.2" width="1024" height="37.9" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="317.4" width="1024" height="35.8" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="369.6" width="1024" height="33.6" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="420.8" width="1024" height="31.4" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="471.1" width="1024" height="29.3" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="520.4" width="1024" height="27.1" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="568.8" width="1024" height="24.9" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="616.2" width="1024" height="22.7" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="662.6" width="1024" height="20.6" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="708" width="1024" height="18.4" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="752.5" width="1024" height="16.2" fill="url(#wordmark-moon-g)" />
              <rect x="0" y="796" width="1024" height="54" fill="url(#wordmark-moon-g)" />
            </g>
          </svg>
          Nocturne
        </a>
        <nav class="site-nav" aria-label="站点导航">
          <a href="{{docs.docsRoot}}" aria-current="page">文档</a>
          <a href="{{docs.root}}changelog/">更新日志</a>
          <a href="https://github.com/kanzaki-chiya/Nocturne">GitHub</a>
        </nav>
      </div>
    </header>
    <div class="docs-shell wrap">
      <aside class="docs-sidebar" aria-label="文档导航">{{docs.nav}}</aside>
      <details class="docs-mobile-nav">
        <summary>{{docs.group}} · {{docs.title}}</summary>
        <nav aria-label="移动端文档导航">{{docs.nav}}</nav>
      </details>
      <main id="main" class="docs-main">
        <article class="docs-article">{{docs.body}}</article>
        {{docs.pager}}
      </main>
      <aside class="docs-toc" aria-label="本页目录">{{docs.toc}}</aside>
    </div>
    <footer class="site-footer">
      <div class="wrap">
        <span>Nocturne · GPL-3.0</span>
        <a href="https://github.com/kanzaki-chiya/Nocturne">源代码</a>
        <a href="https://github.com/kanzaki-chiya/Nocturne/releases">全部版本</a>
      </div>
    </footer>
  </body>
</html>

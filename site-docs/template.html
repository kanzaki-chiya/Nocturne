<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{docs.title}} — Nocturne 文档</title>
    <link rel="canonical" href="{{docs.canonical}}" />
    <link rel="icon" href="{{docs.root}}assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{docs.root}}assets/base.css" />
    <link rel="stylesheet" href="{{docs.root}}assets/docs.css" />
  </head>
  <body id="top">
    <a class="skip-link" href="#main">跳至正文</a>
    <header class="masthead">
      <div class="wrap">
        <a class="wordmark" href="{{docs.root}}" aria-label="Nocturne 首页">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10.5 1.5a6.5 6.5 0 1 0 4 11.6A7 7 0 0 1 10.5 1.5z" />
          </svg>
          Nocturne
        </a>
        <nav class="site-nav" aria-label="站点导航">
          <a href="{{docs.docsRoot}}" aria-current="page">文档</a>
          <a href="{{docs.root}}changelog/">更新日志</a>
          <a href="https://github.com/kanzaki-chiya/Nocturne">GitHub</a>
        </nav>
      </div>
    </header>
    <div class="docs-shell wrap">
      <aside class="docs-sidebar" aria-label="文档导航">{{docs.nav}}</aside>
      <details class="docs-mobile-nav">
        <summary>{{docs.group}} · {{docs.title}}</summary>
        <nav aria-label="移动端文档导航">{{docs.nav}}</nav>
      </details>
      <main id="main" class="docs-main">
        <article class="docs-article">{{docs.body}}</article>
        {{docs.pager}}
      </main>
      <aside class="docs-toc" aria-label="本页目录">{{docs.toc}}</aside>
    </div>
    <footer class="site-footer">
      <div class="wrap">
        <span>Nocturne · GPL-3.0</span>
        <a href="https://github.com/kanzaki-chiya/Nocturne">源代码</a>
        <a href="https://github.com/kanzaki-chiya/Nocturne/releases">全部版本</a>
      </div>
    </footer>
  </body>
</html>
